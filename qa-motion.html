<!doctype html><html><head><meta charset="utf-8"><title>Dear, mechanical checks</title><style>@import url('/fonts/courier-prime.css');body{margin:0}canvas{position:fixed;inset:0;width:100%;height:100%}#results{position:fixed;top:10px;left:10px;background:#f4ead7ed;padding:18px;font:13px monospace;white-space:pre-wrap;z-index:5;max-width:450px}.object-control{position:fixed;width:23px;height:23px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}</style></head><body><canvas id="scene"></canvas><div id="hotspots"></div><pre id="results">Checking rapid strikes, rest poses, keyboard bounds and typeball replacement…</pre><script type="module">
import {Desk} from '/src/scene.js';import {page} from '/src/mechanics.js';import {Box3} from 'three';
const desk=new Desk(document.querySelector('canvas'),()=>{}),wait=ms=>new Promise(r=>setTimeout(r,ms)),result={};desk.view(true);await wait(2100);
desk.scene.updateMatrixWorld(true);result.deskObjectsSupported=desk.contacts.every(mesh=>Math.abs(new Box3().setFromObject(mesh).min.y+.175)<.01);
for(let i=0;i<45;i++){desk.hit(i%3===0?'A':i%3===1?'a':'!');await wait(9);}await wait(220);
result.manualBarsAtRest=desk.typebars.every(b=>Math.abs(b.quaternion.w-1)<1e-9);result.ribbonAtRest=desk.vibrator.position.y===2.4;result.keysAtRest=desk.keys.every(k=>Math.abs(k.k.position.y-k.y)<1e-9&&(!k.l||Math.abs(k.l.position.y-k.y-.074)<1e-9));
const before=desk.typebars.map(b=>b.quaternion.toArray());desk.hit(' ');await wait(170);result.spaceDoesNotStrike=JSON.stringify(before)===JSON.stringify(desk.typebars.map(b=>b.quaternion.toArray()));
result.viewport=[innerWidth,innerHeight];result.wholeKeyboardFits=desk.hotspots.filter(h=>h.b.classList.contains('key-control')).every(({b})=>{const r=b.getBoundingClientRect();return r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight;});
desk.setModel('typeball');desk.updateCarriage(page());await desk.hit('B');result.typeballRecoils=desk.ball.position.length()===0&&desk.ballVibrator.position.y===0&&desk.ballHead.rotation.x===0&&desk.ballHead.rotation.y===0;
result.exclusiveMechanisms=!desk.manualParts.visible&&desk.electricParts.visible&&desk.carriage.position.x===0;result.latchLeavesWithBall=desk.ballLatch.parent===desk.ballHead;
await desk.replaceBall('cutive');result.replacementSettles=desk.ballFont==='cutive'&&desk.ball.position.length()<1e-9&&desk.ballCover.rotation.x===0&&desk.ballLatch.rotation.z===0;
const c=document.createElement('canvas');c.width=148;c.height=210;c.getContext('2d').fillRect(0,0,148,210);const p=page();await desk.paper(c,p,true);result.paperClipsBelowRoller=desk.paperMesh.material.clippingPlanes?.[0]===desk.paperClip;
const geometry=desk.paperMesh.geometry,scale=desk.paperGroup.scale.clone();const removing=desk.remove();await wait(500);const exitPosition=desk.paperGroup.position.clone();await desk.paper(c,p);result.noRenderDuringExit=desk.paperMesh.geometry===geometry&&desk.paperGroup.position.equals(exitPosition);await removing;result.exitSettles=!desk.paperGroup.visible&&desk.paperBail.rotation.x===0&&desk.paperGroup.scale.equals(scale)&&desk.paperMotion===null;
document.querySelector('#results').textContent=JSON.stringify(result,null,2);
</script></body></html>
