<!doctype html><html><head><meta charset="utf-8"><title>Dear, storage checks</title><style>body{font:14px system-ui;background:#efe2c8;padding:25px}pre{white-space:pre-wrap}</style></head><body><h1>Storage checks</h1><pre id="results">Running…</pre><script type="module">
import * as storage from '/src/storage.js';import {page,project,strike} from '/src/mechanics.js';import {storageKind} from '/src/projects.js';
const result={},tag=crypto.randomUUID(),work=project();work.qaTag=tag;work.name='QA mixed work';work.nameEdited=true;work.pages=[page('light'),page('postcard'),page('thick'),page('light')];work.active=1;for(const [i,p]of work.pages.entries())strike(p,String(i));const original=JSON.stringify(work.pages);
await storage.put('projects',work);await storage.migrateLegacyWorks();let parts=(await storage.all()).filter(w=>w.qaTag===tag);result.legacyHasThreeCategories=parts.length===3&&parts.every(w=>storageKind(w)!=='mixed');result.selectedPageKeepsWorkId=parts.find(w=>w.id===work.id)?.pages[0].id===work.pages[1].id;result.allOriginalPagesKept=JSON.stringify(parts.flatMap(w=>w.pages).sort((a,b)=>a.id.localeCompare(b.id)))===JSON.stringify(JSON.parse(original).sort((a,b)=>a.id.localeCompare(b.id)));await storage.migrateLegacyWorks();result.migrationDoesNotDuplicate=(await storage.all()).filter(w=>w.qaTag===tag).length===3;
const item=parts[0],before=JSON.stringify(item.pages);await storage.remove(item.id);await storage.put('projects',item);result.delayedSaveCannotUndelete=!(await storage.all()).some(w=>w.id===item.id)&&(await storage.all({trash:true})).some(w=>w.id===item.id);await storage.restore(item.id);result.restoreKeepsInk=JSON.stringify((await storage.all()).find(w=>w.id===item.id)?.pages)===before;
for(const part of parts)await storage.remove(part.id);result.fixturesInRecycleBin=(await storage.all({trash:true})).filter(w=>w.qaTag===tag).length===3;document.querySelector('#results').textContent=JSON.stringify(result,null,2);
</script></body></html>
