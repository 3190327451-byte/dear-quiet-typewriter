<!doctype html><html><head><meta charset="utf-8"><title>Dear, export checks</title><style>@import url('/fonts/courier-prime.css');body{font:15px system-ui;background:#e9ddc3;padding:25px;color:#463e2d}img{width:min(100%,1100px)}pre{white-space:pre-wrap}</style></head><body><h1>Export checks</h1><pre id="results">Running…</pre><img id="result" alt="Postcard export containing both front photograph and back ink"><script type="module">
import {page,strike,project} from '/src/mechanics.js';import {renderPaper} from '/src/ink.js';import {keepsakeCanvas} from '/src/export.js';
const p=page('postcard');p.photo='/art/animal-stamps.png';for(const c of 'Dear, a postcard for you.')strike(p,c);p.stamps=[{kind:'stamp',animal:7,edition:2,ratio:1,x:128,y:10,angle:0}];strike(p,'C',{font:'cutive',size:4.5,drift:.8,variation:.4});strike(p,'E',{font:'elite'});const marks=JSON.stringify(p.marks);
const one=await renderPaper(p),two=await renderPaper(JSON.parse(JSON.stringify(p)));const c=await keepsakeCanvas(p,false);document.querySelector('#result').src=c.toDataURL();
const out={deterministicPaper:one.toDataURL()===two.toDataURL(),keepsakeWidth:c.width,keepsakeHeight:c.height,faces:2,originalMarksUnchanged:JSON.stringify(p.marks)===marks,paperStockHasNoTransparentHoles:one.getContext('2d').getImageData(100,100,1,1).data[3]===255};
const ctx=c.getContext('2d'),frontPixel=[...ctx.getImageData(840,1000,1,1).data],backPixel=[...ctx.getImageData(2360,1000,1,1).data];out.distinctFrontAndBackPixels=JSON.stringify(frontPixel)!==JSON.stringify(backPixel);document.querySelector('#results').textContent=JSON.stringify(out,null,2);
</script></body></html>
